<svg xmlns="http://www.w3.org/2000/svg" width="960" height="740" viewBox="0 0 960 740" role="img" aria-labelledby="title desc">
<title id="title">Team logo collection</title>
<desc id="desc">Three distinct embroidered-style sports team emblems on display cards, with Texas SCTP navy, red and warm gold details.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#4e738d" stop-opacity=".45"/><stop offset="1" stop-color="#102d4b" stop-opacity="0"/></radialGradient>
 <linearGradient id="card" x1="0" x2="1" y2="1"><stop stop-color="#f6f3eb"/><stop offset="1" stop-color="#dfe5e8"/></linearGradient>
 <linearGradient id="silver" x1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#d5e3ec"/></linearGradient>
 <linearGradient id="navy" x1="0" x2="1" y2="1"><stop stop-color="#234f71"/><stop offset=".52" stop-color="#0b2845"/><stop offset="1" stop-color="#071a30"/></linearGradient>
 <linearGradient id="red" x1="0" x2="1"><stop stop-color="#d8373d"/><stop offset="1" stop-color="#8f182d"/></linearGradient>
 <linearGradient id="gold" x1="0" x2="1" y2="1"><stop stop-color="#ffe3a4"/><stop offset=".6" stop-color="#e3af51"/><stop offset="1" stop-color="#a97924"/></linearGradient>
 <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%"><feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#020a12" flood-opacity=".43"/></filter>
 <filter id="smallshadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020a12" flood-opacity=".35"/></filter>
 <pattern id="weave" width="7" height="7" patternUnits="userSpaceOnUse"><path d="M0 0l7 7M7 0L0 7" stroke="#b9c9d1" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<ellipse cx="515" cy="385" rx="445" ry="330" fill="url(#glow)"/>
<g opacity=".23" fill="none" stroke="#91b4cc" stroke-width="1.5">
 <path d="M95 560Q455 60 895 220"/><path d="M75 610Q500 95 921 260"/>
 <path d="M110 520Q450 20 875 180"/>
</g>
<!-- Left embroidered cream patch -->
<g transform="translate(155 190) rotate(-13 190 220)" filter="url(#shadow)">
 <rect x="0" y="0" width="360" height="440" rx="30" fill="url(#card)" stroke="#fff" stroke-width="8"/>
 <rect x="15" y="16" width="330" height="408" rx="24" fill="none" stroke="#c59d58" stroke-width="2" stroke-dasharray="5 9"/>
 <rect x="31" y="31" width="298" height="378" rx="20" fill="#f7f7f3" stroke="#203f59" stroke-width="5"/>
 <path d="M180 73C125 73 77 109 76 161v103c0 61 67 110 104 132 43-24 104-71 104-132V161c0-50-48-88-104-88Z" fill="url(#navy)" stroke="url(#gold)" stroke-width="12"/>
 <path d="M180 91C136 91 95 122 95 169v88c0 46 47 86 85 108 39-23 86-61 86-108v-88c0-46-42-78-86-78Z" fill="none" stroke="#c8a461" stroke-width="2" stroke-dasharray="2 7"/>
 <path d="m180 128 14 34 37 2-28 25 8 37-31-19-32 19 8-37-28-25 38-2Z" fill="url(#gold)" stroke="#fff5d9" stroke-width="3"/>
 <path d="M132 266c27-19 70-19 96 0M142 279c28-13 49-13 77 0" fill="none" stroke="#e9f2f6" stroke-width="5" stroke-linecap="round"/>
 <path d="M130 321h100" stroke="#bd3842" stroke-width="11" stroke-linecap="round"/>
</g>
<!-- Tall front patch -->
<g transform="translate(420 55) rotate(10 182 226)" filter="url(#shadow)">
 <rect width="363" height="455" rx="31" fill="#0c2948" stroke="#e8f0f3" stroke-width="8"/>
 <rect x="17" y="17" width="329" height="421" rx="23" fill="url(#navy)" stroke="url(#gold)" stroke-width="4"/>
 <rect x="34" y="34" width="295" height="386" rx="15" fill="url(#weave)"/>
 <path d="M182 65 297 112v125c0 87-55 136-115 168C121 372 67 323 67 237V112Z" fill="#f5f5ee" stroke="#c92d3d" stroke-width="13" stroke-linejoin="round"/>
 <path d="M182 85 276 124v110c0 67-38 114-94 142-55-28-94-75-94-142V124Z" fill="#102f4f" stroke="#e4b460" stroke-width="4"/>
 <path d="m175 140 15 37 41 2-32 26 11 40-35-21-35 21 11-40-31-26 40-2Z" fill="#e7b85d" stroke="#fff5cc" stroke-width="3"/>
 <path d="m110 286 34 15 25-20M241 286l-34 15-25-20" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
 <circle cx="176" cy="285" r="27" fill="#f16f39" stroke="#ffe1b4" stroke-width="4"/>
 <path d="M155 282q20-13 40 0" fill="none" stroke="#ffbc76" stroke-width="2"/>
 <path d="M121 341h109" stroke="#e4b460" stroke-width="7" stroke-linecap="round"/>
</g>
<!-- Small logo tile in front -->
<g transform="translate(390 390) rotate(-7 185 140)" filter="url(#shadow)">
 <rect width="386" height="270" rx="26" fill="url(#silver)" stroke="#fff" stroke-width="9"/>
 <rect x="20" y="20" width="346" height="230" rx="16" fill="#fffaf0" stroke="#d9a441" stroke-width="4"/>
 <path d="M72 88h58l26-27 30 26 34-12 26 35-7 50-38 35-56-7-24 18-34-33-30 2 9-47Z" fill="#b51e35" stroke="#102f4f" stroke-width="8" stroke-linejoin="round"/>
 <path d="m145 99 8 22 24 1-20 16 7 23-19-13-20 13 7-23-20-16 25-1Z" fill="#fff"/>
 <g stroke="#203d57" stroke-width="5" stroke-linecap="round" fill="none"><path d="M264 92l35 33-35 35"/><path d="M280 92l35 33-35 35"/><path d="M262 183h61"/></g>
 <circle cx="300" cy="62" r="14" fill="#e2ac53"/>
</g>
<!-- tiny gold pin detail -->
<g transform="translate(785 195)" filter="url(#smallshadow)">
 <circle r="34" fill="url(#gold)" stroke="#fff3d9" stroke-width="5"/>
 <path d="m0-18 5 13 14 0-11 8 4 13-12-8-11 8 4-13-11-8h14Z" fill="#0f2c4c"/>
</g>
</svg>